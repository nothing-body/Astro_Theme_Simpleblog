name: Cross-platform validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      PUBLIC_SITE_URL: https://example.com
      PUBLIC_CONTACT_EMAIL: contact@example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run cross-platform source checks
        run: pnpm selfcheck -- --quick

      - name: Validate all local deployment plans in English
        run: pnpm deploy:switch --mode=direct:cf+vps+vps-docker+vercel+netlify+supabase --lang=en --dry-run --yes

      - name: Validate all local deployment plans in Traditional Chinese
        run: pnpm deploy:switch --mode=direct:cf+vps+vps-docker+vercel+netlify+supabase --lang=zh-tw --dry-run --yes

      - name: Validate all local deployment plans in Simplified Chinese
        run: pnpm deploy:switch --mode=direct:cf+vps+vps-docker+vercel+netlify+supabase --lang=zh-cn --dry-run --yes

      - name: Validate Git provider deployment plans
        run: pnpm deploy:switch --mode=github:cf+vps+vps-docker+vercel+netlify+supabase --dry-run --yes

      - name: Validate GitLab deployment plan
        run: pnpm deploy:switch --mode=gitlab:cf+netlify+supabase --dry-run --yes

      - name: Validate Codeberg deployment plan
        run: pnpm deploy:switch --mode=codeberg:vps+vps-docker --dry-run --yes

      - name: Audit installed dependencies
        if: runner.os == 'Linux'
        run: pnpm audit:security

      - name: Verify npm fallback
        if: runner.os == 'Linux'
        run: npm run deploy:switch -- --mode=direct:cf+vps+vps-docker+vercel+netlify+supabase --lang=en --dry-run --yes
